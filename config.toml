# 主题参数
[params]
  defaultTheme = "auto"
  ShowShareButtons = true
  ShowReadingTime = true
  displayFullLangName = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  ShowToc = true
  
  # 自定义CSS
  customCSS = ["css/custom.css"]
  
  # 修复多语言链接问题
  [params.homeInfoParams]
    Title = "冻土回声 × 东北亚独立游戏联盟"
    Content = "连接北境的创意回声，汇聚独立游戏的力量。"
    
  # 自定义首页样式
  [params.assets]
    favicon = "favicon.ico"
    disableHLJS = true
    
  [params.label]
    icon = "/images/PE_Logo.png"
    iconHeight = 120
    iconWidth = 120

