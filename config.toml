baseURL = "https://permafrost-echo.com"
title = "冻土回声 × 东北亚独立游戏联盟"
theme = "PaperMod"

# 默认语言设置
defaultContentLanguage = "zh"
defaultContentLanguageInSubdir = true

# 多语言支持配置
[languages]
  [languages.zh]
    languageName = "中文"
    weight = 1
    title = "冻土回声 × 东北亚独立游戏联盟"
    description = "连接北境的创意回声，汇聚独立游戏的力量。"
    [languages.zh.params]
      subtitle = "我们相信，寒冷的土地也能孕育最热烈的灵感。"
    [languages.zh.menu]
      [[languages.zh.menu.main]]
        identifier = "home"
        name = "首页"
        url = "/zh/"
        weight = 10
      [[languages.zh.menu.main]]
        identifier = "about-zh"
        name = "关于我们"
        url = "/zh/about/"
        weight = 20
      [[languages.zh.menu.main]]
        identifier = "events-zh"
        name = "活动与展会"
        url = "/zh/events/"
        weight = 30
      [[languages.zh.menu.main]]
